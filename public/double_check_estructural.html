<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double Check Estructural — IV Ingenierías</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    /* IV Ingenierías — carbón / azul sien / gris */
    --navy:#0d1117; --navy-700:#161b22; --navy-900:#0a0c10;
    --cyan:#53cbbf; --cyan-soft:#6fe0d4;
    --ink:#e9edf0; --muted:#7c8794; --line:#23292f;
    --ok:#3fb98f; --warn:#e0a032; --bad:#e26370;
    --panel:#12161c; --panel-2:#171c23;
    --slate:#606060;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--navy-900); color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:20px 28px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    background:var(--navy-700);
    position:sticky; top:0; z-index:20;
    box-shadow:inset 0 -2px 0 0 var(--cyan);
  }
  .brand{display:flex; align-items:center; gap:16px}
  .logo{height:34px;width:auto;display:block;background:#fff;border-radius:6px;padding:5px 8px}
  h1{font-size:15px;margin:0;letter-spacing:.5px;font-weight:600}
  .brand .divider{width:1px;height:34px;background:var(--line)}
  .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 28px 80px}

  .setup{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px; margin-bottom:26px; display:flex; flex-wrap:wrap;
    gap:18px 26px; align-items:flex-end;
  }
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  input[type=text],input[type=number]{
    background:var(--navy-900);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:9px 11px;font-family:inherit;font-size:13px;min-width:140px;
  }
  input:focus{outline:none;border-color:var(--cyan)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:7px;font-weight:600;transition:.15s}
  .btn-primary{background:var(--cyan);color:#0a1418;padding:10px 18px;font-size:13px}
  .btn-primary:hover{background:var(--cyan-soft)}
  .btn-ghost{background:transparent;color:var(--cyan);border:1px solid var(--line);padding:9px 15px;font-size:12px}
  .btn-ghost:hover{border-color:var(--cyan)}

  .section{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    margin-bottom:20px; overflow:hidden;
  }
  .sec-head{
    display:flex;align-items:center;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:var(--panel-2);
  }
  .sec-num{width:30px;height:30px;border-radius:7px;background:var(--navy);
    border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--cyan);flex-shrink:0}
  .sec-name{background:transparent;border:none;border-bottom:1px solid transparent;color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:600;padding:4px 2px;min-width:220px}
  .sec-name:focus{outline:none;border-bottom-color:var(--cyan)}
  .badge{margin-left:auto;font-size:11px;padding:5px 12px;border-radius:20px;font-weight:600;letter-spacing:.5px}
  .badge.ok{background:rgba(39,192,138,.15);color:var(--ok);border:1px solid rgba(39,192,138,.4)}
  .badge.warn{background:rgba(240,165,43,.15);color:var(--warn);border:1px solid rgba(240,165,43,.4)}
  .badge.bad{background:rgba(238,94,108,.15);color:var(--bad);border:1px solid rgba(238,94,108,.4)}
  .badge.pend{background:rgba(139,144,184,.12);color:var(--muted);border:1px solid var(--line)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .grid-shear{border-top:1px solid var(--line)}
  .pane{padding:18px 20px}
  .pane:first-child{border-right:1px solid var(--line)}
  .pane-label{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.9px;margin-bottom:10px;font-weight:600}
  .drop{
    border:1.5px dashed var(--line);border-radius:9px;min-height:150px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:var(--muted);font-size:12px;cursor:pointer;position:relative;overflow:hidden;
    transition:.15s;background:var(--navy-900)
  }
  .drop:hover{border-color:var(--cyan);color:var(--cyan)}
  .drop.has-img{border-style:solid;padding:0;min-height:auto;cursor:zoom-in}
  .drop img{width:100%;display:block}
  .drop .hint{padding:24px 16px;line-height:1.6}
  /* zoom badge: only over a loaded image, on hover */
  .zoom-badge{position:absolute;top:8px;right:8px;background:rgba(10,12,16,.82);color:var(--cyan);
    font-size:10px;padding:4px 9px;border-radius:5px;border:1px solid var(--cyan);
    opacity:0;transition:.15s;pointer-events:none;letter-spacing:.4px}
  .drop:not(.has-img) .zoom-badge{display:none}
  .drop.has-img:hover .zoom-badge{opacity:1}
  /* replace button: separate control, only when an image is loaded */
  .repl-btn{display:none;margin-top:8px;width:100%;background:transparent;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:11px;
    font-family:inherit;cursor:pointer;letter-spacing:.3px;transition:.15s}
  .repl-btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .pane.has-image .repl-btn{display:block}

  .vals{padding:16px 20px;border-top:1px solid var(--line);background:var(--panel-2);
    display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
  .vrow{display:flex;flex-direction:column;gap:5px}
  .vrow input{min-width:110px}
  .unit{font-size:10px;color:var(--muted)}
  .mark-group{display:flex;gap:8px;margin-left:auto;align-items:center}
  .mark-btn{padding:8px 14px;font-size:12px;border:1px solid var(--line);background:var(--navy-900);color:var(--muted)}
  .mark-btn.sel-ok{background:var(--ok);color:#06291c;border-color:var(--ok)}
  .mark-btn.sel-warn{background:var(--warn);color:#3a2700;border-color:var(--warn)}
  .mark-btn.sel-bad{background:var(--bad);color:#3a0008;border-color:var(--bad)}
  .note{width:100%;margin-top:4px}
  .note input{width:100%;min-width:0}
  .ratio{font-size:12px;color:var(--muted)}
  .ratio b{color:var(--ink)}
  .geo-check{flex-basis:100%;display:flex;align-items:flex-start;gap:10px;cursor:pointer;
    background:var(--navy-900);border:1px solid var(--line);border-radius:8px;padding:11px 14px;
    font-size:12.5px;line-height:1.45;color:var(--muted);transition:.15s}
  .geo-check:hover{border-color:var(--cyan)}
  .geo-check input{width:18px;height:18px;accent-color:var(--cyan);flex-shrink:0;margin-top:1px;cursor:pointer}
  .geo-check input:checked+span{color:var(--ink)}
  .geo-check:has(input:checked){border-color:var(--ok);background:rgba(39,192,138,.07)}
  .geo-check:has(input:checked) input{accent-color:var(--ok)}

  .toolbar{display:flex;gap:12px;justify-content:flex-end;margin-top:8px;position:sticky;bottom:18px;z-index:10}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px;line-height:1.7}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.pane:first-child{border-right:none;border-bottom:1px solid var(--line)}}

  /* Review mode: enlarge images, hide numeric capture, keep marks */
  body.review .drop{min-height:auto;cursor:zoom-in}
  body.review .drop.has-img{cursor:zoom-in}
  body.review .vrow:not(.note){display:none}
  body.review .ratio{display:none}
  body.review .vals>div[style*="flex-basis"]{display:none}
  body.review .pane-label{font-size:13px}
  body.review .repl-btn{display:none !important}
  body.review #reviewToggle{background:var(--cyan);color:#0a1418;border-color:var(--cyan)}
  body.review .setup .field, body.review .setup>button:not(#reviewToggle){opacity:.45;pointer-events:none}

  /* Lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(8,6,22,.94);z-index:100;display:none;
    align-items:center;justify-content:center;flex-direction:column;padding:30px}
  #lightbox.show{display:flex}
  #lightbox img{max-width:94vw;max-height:84vh;border-radius:8px;border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #lbCap{color:var(--ink);font-size:13px;margin-top:16px;letter-spacing:.4px}
  #lbClose{position:absolute;top:20px;right:26px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:8px 14px;font-size:13px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:var(--panel);
    border:1px solid var(--line);color:var(--cyan);width:46px;height:46px;border-radius:50%;font-size:20px}
  #lbPrev{left:22px} #lbNext{right:22px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" id="ivLogo" alt="IV Ingenierías">
    <div class="divider"></div>
    <div>
      <h1>DOUBLE CHECK ESTRUCTURAL</h1>
      <div class="sub">Verificación cruzada · momento actuante vs. cálculo de viga</div>
    </div>
  </div>
  <div style="display:flex;gap:10px">
    <button class="btn-ghost" onclick="document.getElementById('loadFile').click()">Abrir .dcheck</button>
    <button class="btn-ghost" onclick="saveProject()">Guardar .dcheck</button>
    <button class="btn-primary" onclick="exportPDF()">Generar PDF</button>
  </div>
  <input type="file" id="loadFile" accept=".dcheck,application/json" hidden onchange="loadProject(this)">
</header>

<div class="wrap">
  <div class="setup">
    <div class="field">
      <label>Proyecto</label>
      <input type="text" id="proyecto" style="min-width:220px">
    </div>
    <div class="field">
      <label>Revisó</label>
      <input type="text" id="reviso">
    </div>
    <div class="field">
      <label>Fecha</label>
      <input type="text" id="fecha">
    </div>
    <div class="field">
      <label>No. de secciones</label>
      <input type="number" id="numSec" min="1" max="40" value="3">
    </div>
    <button class="btn-primary" onclick="buildSections()">Preparar entorno</button>
    <button class="btn-ghost" onclick="addOne()">+ Agregar una</button>
    <button class="btn-ghost" id="reviewToggle" onclick="toggleReview()" style="margin-left:auto">Modo revisión visual</button>
  </div>

  <div id="sections"></div>

  <div id="emptyState" class="empty">
    Define cuántas secciones vas a verificar y pulsa <b style="color:var(--cyan)">Preparar entorno</b>.<br>
    Por cada sección cargas el screenshot del momento actuante y el del cálculo de viga,
  </div>
</div>

<div id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button id="lbClose" onclick="closeLightbox()">Cerrar ✕</button>
  <button class="lb-nav" id="lbPrev" onclick="lbStep(-1)">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav" id="lbNext" onclick="lbStep(1)">›</button>
  <div id="lbCap"></div>
</div>

function addOne(){
  const inp=document.getElementById('numSec');
  inp.value=(parseInt(inp.value)||0)+1;
  buildSections(true);
}

function buildSections(keep){
  const n=parseInt(document.getElementById('numSec').value)||0;
  const cont=document.getElementById('sections');
  const prev=keep?captureState():{};
  store={};
  cont.innerHTML='';
  document.getElementById('emptyState').style.display=n>0?'none':'block';
  for(let i=0;i<n;i++){
    store[i]={imgA:null,imgB:null,imgC:null,imgD:null};
    cont.insertAdjacentHTML('beforeend',sectionHTML(i));
  }
  if(keep) restoreState(prev);
  for(let i=0;i<n;i++) recalc(i);
}

function sectionHTML(i){
  return `
  <div class="section" id="sec-${i}">
    <div class="sec-head">
      <div class="sec-num">${String(i+1).padStart(2,'0')}</div>

      <div class="badge pend" id="badge-${i}">PENDIENTE</div>
    </div>
    <div class="grid">
      <div class="pane">
        <div class="pane-label">Momento · actuante (programa estructural)</div>
        <div class="drop" id="dropA-${i}" onclick="dropClick(${i},'A')">
          <div class="hint">Click o arrastra el screenshot<br>(RAM / SAP / ETABS)</div>
          <span class="zoom-badge">Ampliar ⤢</span>

    <div class="grid grid-shear">

}

function loadImg(i,which,input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    store[i]['img'+which]=e.target.result;
    paintDrop(i,which,e.target.result);
  };
  r.readAsDataURL(f);
}

// Click on a drop: if it has an image, always open the zoom viewer (any mode).
// If empty, open the file picker to load one.
function dropClick(i,which){
  if(store[i] && store[i]['img'+which]) openLightbox(i,which);
  else document.getElementById('file'+which+'-'+i).click();
}

// Explicit replace via the separate button.
function replaceImg(i,which){
  document.getElementById('file'+which+'-'+i).click();
}

function toggleReview(){
  document.body.classList.toggle('review');
}

// ---- Lightbox with prev/next across all loaded images ----
let lbList=[], lbPos=0;
function buildLbList(){
  lbList=[];
  document.querySelectorAll('.section').forEach(sec=>{
    const i=sec.id.split('-')[1];
    const name=val('name-'+i)||('Sección '+(parseInt(i)+1));
    if(store[i]?.imgA) lbList.push({src:store[i].imgA,cap:`${name} · Momento · actuante (programa)`});
    if(store[i]?.imgB) lbList.push({src:store[i].imgB,cap:`${name} · Momento · cálculo de viga (diseño)`});
    if(store[i]?.imgC) lbList.push({src:store[i].imgC,cap:`${name} · Cortante · actuante (programa)`});
    if(store[i]?.imgD) lbList.push({src:store[i].imgD,cap:`${name} · Cortante · cálculo de viga (diseño)`});
  });
}
function openLightbox(i,which){
  buildLbList();
  const src=store[i]['img'+which];
  lbPos=Math.max(0,lbList.findIndex(x=>x.src===src));
  showLb();
  document.getElementById('lightbox').classList.add('show');
}
function showLb(){
  if(!lbList.length) return;
  document.getElementById('lbImg').src=lbList[lbPos].src;
  document.getElementById('lbCap').textContent=`${lbList[lbPos].cap}   (${lbPos+1}/${lbList.length})`;
}
function lbStep(d){lbPos=(lbPos+d+lbList.length)%lbList.length;showLb();}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show');}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('show'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowRight')lbStep(1);
  if(e.key==='ArrowLeft')lbStep(-1);
});

// ---- Save / Load project (.dcheck = JSON with embedded base64 images) ----
function saveProject(){
  const data={
    format:'sogrub-dcheck', version:1,
    meta:{proyecto:val('proyecto'),reviso:val('reviso'),fecha:val('fecha')},
    sections:[]
  };
  document.querySelectorAll('.section').forEach(sec=>{
    const i=sec.id.split('-')[1];
    data.sections.push({
      name:val('name-'+i),
      ma:val('ma-'+i),mr:val('mr-'+i),un:val('un-'+i),
      man:val('man-'+i),mrn:val('mrn-'+i),
      va:val('va-'+i),vr:val('vr-'+i),unv:val('unv-'+i),
      obs:val('obs-'+i),mark:store[i]?.mark||null,manual:!!store[i]?.manualMark,
      geo:document.getElementById('geo-'+i)?.checked||false,
      imgA:store[i]?.imgA||null,imgB:store[i]?.imgB||null,
      imgC:store[i]?.imgC||null,imgD:store[i]?.imgD||null
    });
  });
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  const stamp=(val('proyecto')||'proyecto').replace(/\s+/g,'_');
  a.href=URL.createObjectURL(blob);
  a.download=`DoubleCheck_${stamp}.dcheck`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadProject(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    let data;
    try{ data=JSON.parse(e.target.result); }
    catch(err){ alert('El archivo no es un .dcheck válido.'); return; }
    if(data.format!=='sogrub-dcheck'){ alert('Formato no reconocido.'); return; }
    setVal('proyecto',data.meta?.proyecto);
    setVal('reviso',data.meta?.reviso);
    if(data.meta?.fecha) document.getElementById('fecha').value=data.meta.fecha;
    const n=data.sections.length;
    document.getElementById('numSec').value=n;
    // build empty sections
    const cont=document.getElementById('sections');
    store={}; cont.innerHTML='';
    document.getElementById('emptyState').style.display=n>0?'none':'block';
    for(let i=0;i<n;i++){ store[i]={imgA:null,imgB:null,imgC:null,imgD:null}; cont.insertAdjacentHTML('beforeend',sectionHTML(i)); }
    // fill
    data.sections.forEach((s,i)=>{
      setVal('name-'+i,s.name);setVal('ma-'+i,s.ma);setVal('mr-'+i,s.mr);setVal('un-'+i,s.un);
      setVal('man-'+i,s.man);setVal('mrn-'+i,s.mrn);
      setVal('va-'+i,s.va);setVal('vr-'+i,s.vr);setVal('unv-'+i,s.unv);setVal('obs-'+i,s.obs);
      store[i].manualMark=s.manual;
      const geoEl=document.getElementById('geo-'+i); if(geoEl) geoEl.checked=!!s.geo;
      if(s.imgA){store[i].imgA=s.imgA;paintDrop(i,'A',s.imgA);}
      if(s.imgB){store[i].imgB=s.imgB;paintDrop(i,'B',s.imgB);}
      if(s.imgC){store[i].imgC=s.imgC;paintDrop(i,'C',s.imgC);}
      if(s.imgD){store[i].imgD=s.imgD;paintDrop(i,'D',s.imgD);}
      recalc(i);
      if(s.mark) setMark(i,s.mark,true);
    });
  };
  r.readAsText(f);
  input.value='';
}

function recalc(i){
  const ma=parseFloat(document.getElementById('ma-'+i).value);
  const mr=parseFloat(document.getElementById('mr-'+i).value);
  const man=parseFloat(document.getElementById('man-'+i).value);
  const mrn=parseFloat(document.getElementById('mrn-'+i).value);
  const va=parseFloat(document.getElementById('va-'+i).value);
  const vr=parseFloat(document.getElementById('vr-'+i).value);
  let rm=null, rmn=null, rv=null;
  const elM=document.getElementById('ratio-'+i);
  const elMn=document.getElementById('ration-'+i);
  const elV=document.getElementById('ratiov-'+i);
  if(!isNaN(ma)&&!isNaN(mr)&&mr!==0){
    rm=Math.abs(ma/mr);
    elM.innerHTML=`Mu/Mr (+) = <b style="color:${rm<=1?PALETTE.ok:PALETTE.bad}">${rm.toFixed(3)}</b>`;
  } else elM.innerHTML='Mu/Mr (+) = <b>—</b>';
  if(!isNaN(man)&&!isNaN(mrn)&&mrn!==0){
    rmn=Math.abs(man/mrn);
    elMn.innerHTML=`Mu/Mr (−) = <b style="color:${rmn<=1?PALETTE.ok:PALETTE.bad}">${rmn.toFixed(3)}</b>`;
  } else elMn.innerHTML='Mu/Mr (−) = <b>—</b>';
  if(!isNaN(va)&&!isNaN(vr)&&vr!==0){
    rv=Math.abs(va/vr);
    elV.innerHTML=`Vu/Vr = <b style="color:${rv<=1?PALETTE.ok:PALETTE.bad}">${rv.toFixed(3)}</b>`;
  } else elV.innerHTML='Vu/Vr = <b>—</b>';

  if(!store[i].manualMark){
    const ratios=[rm,rmn,rv].filter(r=>r!==null);
    if(ratios.length){
      const worst=Math.max(...ratios);
      setMark(i, worst<=0.9?'ok':(worst<=1?'warn':'bad'), true);
    }
  }
}

function setMark(i,mark,auto){
  if(!auto) store[i].manualMark=true;
  store[i].mark=mark;
  ['ok','warn','bad'].forEach(m=>{
    const b=document.getElementById('m-'+m+'-'+i);
    b.className='mark-btn'+(m===mark?' sel-'+m:'');
  });
  const badge=document.getElementById('badge-'+i);
  const map={ok:['ok','VERIFICADO'],warn:['warn','REVISAR'],bad:['bad','NO PASA']};
  badge.className='badge '+map[mark][0];
  badge.textContent=map[mark][1];
}

function captureState(){
  const s={};
  document.querySelectorAll('.section').forEach(sec=>{
    const i=sec.id.split('-')[1];
    s[i]={name:val('name-'+i),ma:val('ma-'+i),mr:val('mr-'+i),un:val('un-'+i),
      man:val('man-'+i),mrn:val('mrn-'+i),
      va:val('va-'+i),vr:val('vr-'+i),unv:val('unv-'+i),
      obs:val('obs-'+i),mark:store[i]?.mark,
      geo:document.getElementById('geo-'+i)?.checked,
      imgA:store[i]?.imgA,imgB:store[i]?.imgB,imgC:store[i]?.imgC,imgD:store[i]?.imgD,
      manual:store[i]?.manualMark};
  });
  return s;
}
function restoreState(s){
  Object.keys(s).forEach(i=>{
    if(!document.getElementById('sec-'+i)) return;
    setVal('name-'+i,s[i].name);setVal('ma-'+i,s[i].ma);setVal('mr-'+i,s[i].mr);
    setVal('un-'+i,s[i].un);setVal('man-'+i,s[i].man);setVal('mrn-'+i,s[i].mrn);
    setVal('va-'+i,s[i].va);setVal('vr-'+i,s[i].vr);
    setVal('unv-'+i,s[i].unv);setVal('obs-'+i,s[i].obs);
    store[i].manualMark=s[i].manual;
    const geoEl=document.getElementById('geo-'+i); if(geoEl) geoEl.checked=!!s[i].geo;
    if(s[i].imgA){store[i].imgA=s[i].imgA;paintDrop(i,'A',s[i].imgA);}
    if(s[i].imgB){store[i].imgB=s[i].imgB;paintDrop(i,'B',s[i].imgB);}
    if(s[i].imgC){store[i].imgC=s[i].imgC;paintDrop(i,'C',s[i].imgC);}
    if(s[i].imgD){store[i].imgD=s[i].imgD;paintDrop(i,'D',s[i].imgD);}
    if(s[i].mark) setMark(i,s[i].mark,true);
  });
}
function paintDrop(i,w,src){const d=document.getElementById('drop'+w+'-'+i);d.classList.add('has-img');
  d.innerHTML=`<img src="${src}"><span class="zoom-badge">Ampliar ⤢</span>`;
  d.closest('.pane')?.classList.add('has-image');}
function val(id){return document.getElementById(id)?.value||'';}
function setVal(id,v){const e=document.getElementById(id);if(e)v&&(e.value=v);}

// Drag & drop
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();
  const drop=e.target.closest('.drop'); if(!drop) return;
  const m=drop.id.match(/drop([A-D])-(\d+)/); if(!m) return;
  const f=e.dataTransfer.files[0]; if(!f||!f.type.startsWith('image')) return;
  const inp=document.getElementById('file'+m[1]+'-'+m[2]);
  const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;
  loadImg(parseInt(m[2]),m[1],inp);
});

async function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF('p','mm','a4');
  const W=210,H=297,M=14;
  const navy=[13,17,23],cyan=[83,203,191],muted=[124,135,148];
  const proyecto=val('proyecto')||'Proyecto';
  const reviso=val('reviso')||'—';
  const fecha=val('fecha');
  const secs=document.querySelectorAll('.section');

  function header(){
    doc.setFillColor(...navy);doc.rect(0,0,W,24,'F');
    doc.setFillColor(...cyan);doc.rect(0,24,W,1.2,'F');
    doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text('DOUBLE CHECK ESTRUCTURAL',M,11);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(190,196,204);
    doc.text('Verificacion cruzada · momento actuante vs. calculo de viga',M,17);
    try{
      const p=doc.getImageProperties(IV_LOGO_LIGHT);
      const lh=13, lw=lh*(p.width/p.height);
      const pad=2.2, chipW=lw+pad*2, chipH=lh+pad*2;
      const cx=W-M-chipW, cy=(24-chipH)/2;
      doc.setFillColor(255,255,255);doc.roundedRect(cx,cy,chipW,chipH,1.5,1.5,'F');
      doc.addImage(IV_LOGO_LIGHT,'PNG',cx+pad,cy+pad,lw,lh);
    }catch(e){
      doc.setTextColor(255);doc.setFontSize(11);doc.setFont('helvetica','bold');
      doc.text('IV INGENIERIAS',W-M,13,{align:'right'});
    }
  }
  function footer(p){
    doc.setDrawColor(220);doc.setLineWidth(.2);doc.line(M,H-12,W-M,H-12);
    doc.setFontSize(7);doc.setTextColor(...muted);doc.setFont('helvetica','normal');
    doc.text(`${proyecto}  ·  Reviso: ${reviso}  ·  ${fecha}`,M,H-8);
    doc.text(`Pag. ${p}`,W-M,H-8,{align:'right'});
  }

  let page=1;header();footer(page);
  let y=34;

  // Cover summary
  doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(11);
  doc.text(proyecto,M,y);y+=8;
  let counts={ok:0,warn:0,bad:0,pend:0};
  secs.forEach(s=>{const i=s.id.split('-')[1];const mk=store[i]?.mark||'pend';counts[mk]++;});
  doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(60,60,60);
  doc.text(`Secciones: ${secs.length}    Verificadas: ${counts.ok}    Revisar: ${counts.warn}    No pasa: ${counts.bad}    Pendientes: ${counts.pend}`,M,y);
  y+=6;doc.setDrawColor(...cyan);doc.setLineWidth(.4);doc.line(M,y,W-M,y);y+=8;

  const labelMap={ok:['VERIFICADO',PALETTE.ok],warn:['REVISAR',PALETTE.warn],bad:['NO PASA',PALETTE.bad],pend:['PENDIENTE','#8b90b8']};
  function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

  for(let k=0;k<secs.length;k++){
    const i=secs[k].id.split('-')[1];
    const name=val('name-'+i)||('Seccion '+(parseInt(i)+1));
    const mk=store[i]?.mark||'pend';
    const blockH=170;
    if(y+blockH>H-16){doc.addPage();page++;header();footer(page);y=34;}

    // section title bar
    doc.setFillColor(...navy);doc.roundedRect(M,y,W-2*M,9,1.5,1.5,'F');
    doc.setTextColor(...cyan);doc.setFont('helvetica','bold');doc.setFontSize(9);
    doc.text(String(parseInt(i)+1).padStart(2,'0'),M+4,y+6);
    doc.setTextColor(255);doc.text(name,M+13,y+6);
    const [lbl,col]=labelMap[mk];const c=hex(col);
    doc.setFillColor(...c);const lw=doc.getTextWidth(lbl)+8;
    doc.roundedRect(W-M-lw-2,y+2,lw,5.5,1,1,'F');
    doc.setTextColor(mk==='pend'?255:20,mk==='pend'?255:20,mk==='pend'?255:20);
    doc.setFontSize(7);doc.text(lbl,W-M-lw/2-2,y+5.8,{align:'center'});
    y+=12;

    // image rows: momento (A/B) and cortante (C/D)
    const colW=(W-2*M-6)/2;const imgH=42;
    doc.setFontSize(6.5);doc.setTextColor(...cyan);doc.setFont('helvetica','bold');
    doc.text('MOMENTO · ACTUANTE (PROGRAMA)',M,y);
    doc.text('MOMENTO · CALCULO DE VIGA (DISENO)',M+colW+6,y);
    y+=2.5;
    drawImg(store[i]?.imgA,M,y,colW,imgH);
    drawImg(store[i]?.imgB,M+colW+6,y,colW,imgH);
    y+=imgH+4;
    doc.setFontSize(6.5);doc.setTextColor(...cyan);doc.setFont('helvetica','bold');
    doc.text('CORTANTE · ACTUANTE (PROGRAMA)',M,y);
    doc.text('CORTANTE · CALCULO DE VIGA (DISENO)',M+colW+6,y);
    y+=2.5;
    drawImg(store[i]?.imgC,M,y,colW,imgH);
    drawImg(store[i]?.imgD,M+colW+6,y,colW,imgH);
    y+=imgH+5;

    // values table (M+, M-, cortante)
    const ma=val('ma-'+i),mr=val('mr-'+i),un=val('un-'+i)||'t·m';
    const man=val('man-'+i),mrn=val('mrn-'+i);
    const va=val('va-'+i),vr=val('vr-'+i),unv=val('unv-'+i)||'t';
    let ratioM='—',ratioMn='—',ratioV='—';
    if(ma&&mr&&parseFloat(mr)!==0) ratioM=Math.abs(parseFloat(ma)/parseFloat(mr)).toFixed(3);
    if(man&&mrn&&parseFloat(mrn)!==0) ratioMn=Math.abs(parseFloat(man)/parseFloat(mrn)).toFixed(3);
    if(va&&vr&&parseFloat(vr)!==0) ratioV=Math.abs(parseFloat(va)/parseFloat(vr)).toFixed(3);
    doc.setFillColor(244,245,250);doc.roundedRect(M,y,W-2*M,39,1.5,1.5,'F');
    // column headers
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...muted);
    doc.text('Solicitacion',M+4,y+6);doc.text('Actuante',M+50,y+6);
    doc.text('Resistente',M+96,y+6);doc.text('Demanda/Cap.',M+144,y+6);
    doc.setDrawColor(220);doc.setLineWidth(.2);doc.line(M+4,y+8,W-M-4,y+8);

    function valRow(yy,etq,act,res,un2,ratio){
      doc.setFont('helvetica','bold');doc.setTextColor(...navy);doc.setFontSize(8.5);
      doc.text(etq,M+4,yy);
      doc.setFont('helvetica','normal');doc.setTextColor(40,40,40);doc.setFontSize(9);
      doc.text(`${act||'—'} ${un2}`,M+50,yy);
      doc.text(`${res||'—'} ${un2}`,M+96,yy);
      const rc=(ratio!=='—'&&parseFloat(ratio)<=1)?hex(PALETTE.ok):(ratio!=='—'?hex(PALETTE.bad):muted);
      doc.setFont('helvetica','bold');doc.setTextColor(...rc);doc.text(ratio,M+144,yy);
    }
    valRow(y+14,'Momento (+)  Mu/Mr',ma,mr,un,ratioM);
    valRow(y+23,'Momento (-)  Mu/Mr',man,mrn,un,ratioMn);
    valRow(y+32,'Cortante     Vu/Vr',va,vr,unv,ratioV);
    const obs=val('obs-'+i);
    if(obs){doc.setTextColor(...muted);doc.setFont('helvetica','italic');doc.setFontSize(7.5);
      doc.text('Obs: '+obs.slice(0,90),M+4,y+43,{maxWidth:W-2*M-8});y+=4;}
    y+=43;
    // geometry/material verification confirmation
    const geo=document.getElementById('geo-'+i)?.checked;
    const gc=geo?hex(PALETTE.ok):muted;
    doc.setDrawColor(...gc);doc.setLineWidth(.5);
    doc.setFillColor(...(geo?[238,247,242]:[248,248,250]));
    doc.roundedRect(M,y,3.6,3.6,.6,.6,'FD');
    if(geo){doc.setLineWidth(.6);doc.line(M+.8,y+1.9,M+1.5,y+2.7);doc.line(M+1.5,y+2.7,M+2.9,y+.9);}
    doc.setFont('helvetica',geo?'bold':'normal');doc.setFontSize(7.5);doc.setTextColor(...(geo?hex(PALETTE.ok):muted));
    doc.text('Verifique que la seccion propuesta es la misma que esta en el modelo estructural (geometria y material)',M+6,y+3);
    y+=8;
  }

  function drawImg(src,x,yy,w,h){
    doc.setDrawColor(210);doc.setLineWidth(.3);
    if(src){
      try{
        const props=doc.getImageProperties(src);
        const ar=props.width/props.height;let dw=w,dh=w/ar;
        if(dh>h){dh=h;dw=h*ar;}
        const ox=x+(w-dw)/2,oy=yy+(h-dh)/2;
        doc.setFillColor(248,248,250);doc.rect(x,yy,w,h,'F');
        doc.addImage(src,'PNG',ox,oy,dw,dh);
        doc.rect(x,yy,w,h,'S');
      }catch(e){placeholder(x,yy,w,h);}
    } else placeholder(x,yy,w,h);
  }
  function placeholder(x,yy,w,h){
    doc.setFillColor(248,248,250);doc.rect(x,yy,w,h,'F');doc.rect(x,yy,w,h,'S');
    doc.setTextColor(...muted);doc.setFontSize(7);doc.setFont('helvetica','normal');
    doc.text('sin captura',x+w/2,yy+h/2,{align:'center'});
  }

  doc.save(`DoubleCheck_${proyecto.replace(/\s+/g,'_')}.pdf`);
}

buildSections();
